#
# CI builds an unsigned HAP on GitHub-hosted runners with ZERO repository
# configuration — no secrets, no variables. The HarmonyOS toolchain comes
# from public, login-free download sources (verified 2026-11-16):
#
#   Primary:  Hugging Face mirror, revision-pinned zip
#             commandline-tools-linux-x64-6.1.1.280.zip (~2.1 GB, bundled
#             SDK matches modelVersion 6.1.1 / API 24)
#   Fallback: same file on the mirror's main branch (appears there after
#             mirror updates)
#
# Huawei's own download page is login-gated (403 for direct CDN probes),
# which is why a public mirror is used. The revision pin is immutable, so
# the URL is stable; after the first successful run the zip is cached by
# actions/cache and survives mirror changes anyway.
#
# Optional: set repository VARIABLE HOS_TOOLS_URL to pin a different
# toolchain zip (tried first). Release signing stays a local, manual step —
# CI artifacts are unsigned.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOS_TOOLS_PRIMARY: https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/7ff999061d57e9a542fe7e02fc920961e67a163b/commandline-tools-linux-x64-6.1.1.280.zip
  HOS_TOOLS_FALLBACK: https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/main/commandline-tools-linux-x64-6.1.1.280.zip

jobs:
  verify:
    name: License & config sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: SPDX headers (MPL-2.0-no-copyleft-exception)
        run: python3 scripts/check_mpl_headers.py
      - name: Config rules (strict JSON, modelVersion, SDK strings)
        run: python3 scripts/check_configs.py

  build:
    name: Build HAP (unsigned)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain zip
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/commandline-tools.zip
          key: hos-tools-6.1.1.280-v1

      - name: Download HarmonyOS command line tools (public, no auth)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          CANDIDATES=(
            "${{ vars.HOS_TOOLS_URL }}"
            "$HOS_TOOLS_PRIMARY"
            "$HOS_TOOLS_FALLBACK"
          )
          for url in "${CANDIDATES[@]}"; do
            [ -n "$url" ] || continue
            echo "Trying: $url"
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 \
                 -o ~/commandline-tools.zip "$url"; then
              echo "Downloaded from: $url"
              exit 0
            fi
            echo "Candidate failed, trying next…"
          done
          echo "::error::All commandline-tools sources failed."
          exit 1

      - name: Unpack and wire up toolchain
        run: |
          mkdir -p ~/hos-tools
          unzip -q ~/commandline-tools.zip -d ~/hos-tools
          TOOLS_HOME=$(find ~/hos-tools -maxdepth 2 -type d -name "commandline-tools" | head -1)
          if [ -z "$TOOLS_HOME" ] || [ ! -f "$TOOLS_HOME/tools/hvigor/bin/hvigorw.js" ]; then
            echo "::error::commandline-tools layout not recognised in the zip"
            exit 1
          fi
          if [ ! -d "$TOOLS_HOME/sdk" ]; then
            echo "::error::zip does not contain a bundled SDK (tools require one)"
            exit 1
          fi
          echo "TOOLS_HOME=$TOOLS_HOME" >> "$GITHUB_ENV"
          echo "$TOOLS_HOME/bin" >> "$GITHUB_PATH"
          echo "DEVECO_SDK_HOME=$TOOLS_HOME/sdk" >> "$GITHUB_ENV"
          echo "OHPM_HOME=$TOOLS_HOME/tools/ohpm" >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          "$TOOLS_HOME/tools/node/bin/node" "$TOOLS_HOME/tools/hvigor/bin/hvigorw.js" --version || true

      - name: Install oh_modules
        run: ohpm install

      - name: Build HAP (debug, unsigned)
        run: hvigorw --mode module -p module=entry@default -p product=default assembleHap

      - name: Collect HAPs
        run: |
          mkdir -p out
          find entry/build -name "*.hap" -exec cp {} out/ \;
          ls -la out

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc4hos-hap
          path: out/*.hap
          retention-days: 7
          if-no-files-found: error

      - name: Upload hvigor logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hvigor-logs
          path: |
            .hvigor/outputs/logs/**
            entry/.cxx/**/*.log
          if-no-files-found: ignore
