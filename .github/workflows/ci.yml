#
# CI builds an unsigned HAP on GitHub-hosted runners with ZERO repository
# configuration — no secrets, no variables. The HarmonyOS toolchain comes
# from public, login-free download sources (verified 2026-11-16):
#
#   Primary:  Hugging Face mirror, revision-pinned zip
#             commandline-tools-linux-x64-6.1.1.280.zip (~2.1 GB, bundled
#             SDK matches modelVersion 6.1.1 / API 24; contents verified:
#             bin/hvigorw, hvigor/bin/hvigorw.js, tool/node, ohpm/,
#             sdk/default/{openharmony,hms} incl. hmos.toolchain.cmake)
#
# NOTE the zip's internal layout differs from DevEco Studio installs:
#   - root dir is HYPHENATED: command-line-tools/
#   - hvigor lives at <root>/hvigor/bin/hvigorw.js (no tools/ level)
#   - node at <root>/tool/node (singular)
#   - user-facing launchers at <root>/bin/{hvigorw,ohpm}
#
# Optional: set repository VARIABLE HOS_TOOLS_URL to pin a different
# toolchain zip (tried first). Release signing stays a local, manual step —
# CI artifacts are unsigned.

name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOS_TOOLS_PRIMARY: https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/7ff999061d57e9a542fe7e02fc920961e67a163b/commandline-tools-linux-x64-6.1.1.280.zip
  HOS_TOOLS_FALLBACK: https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/main/commandline-tools-linux-x64-6.1.1.280.zip

jobs:
  verify:
    name: License & config sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: SPDX headers (MPL-2.0-no-copyleft-exception)
        run: python3 scripts/check_mpl_headers.py
      - name: Config rules (strict JSON, modelVersion, SDK strings)
        run: python3 scripts/check_configs.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Core unit tests
        working-directory: tests
        run: npm test

  build:
    name: Build HAP (unsigned)
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      version: ${{ steps.rel.outputs.version }}
      tag: ${{ steps.rel.outputs.tag }}
      codename: ${{ steps.rel.outputs.codename }}
      patch: ${{ steps.rel.outputs.patch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tag pushes cut a release. Push a base tag (v1.0) to auto-increment
      # the patch, or a full tag (v1.0.7) to pin it. Releases are titled
      # "<version> <Codename> PATCH<n>" and the same version is stamped into
      # AppScope/app.json5 before the build.
      - name: Compute release identity (tags only)
        id: rel
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME#v}"
          BASE="$(echo "$REF" | cut -d. -f1-2)"
          PATCH_PART="$(echo "$REF" | cut -d. -f3)"
          if ! echo "$BASE" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::release tag must look like v1.0 or v1.0.7"
            exit 1
          fi
          if echo "$PATCH_PART" | grep -Eq '^[0-9]+$'; then
            PATCH="$PATCH_PART"
          else
            LATEST="$(git tag -l "v$BASE.*" | sed -E "s/^v$BASE\.([0-9]+)$/\1/" | sort -n | tail -1)"
            PATCH=$(( ${LATEST:-0} + 1 ))
          fi
          VERSION="$BASE.$PATCH"
          CODENAMES=(Aurora Nebula Zephyr Halcyon Meridian Solstice Nimbus Obsidian
                     Lumen Cascade Vireo Onyx Ember Quasar Tundra Cirrus Basalt
                     Sable Mica Cobalt)
          CODENAME="${CODENAMES[$((RANDOM % ${#CODENAMES[@]}))]}"
          sed -i -E "s/(\"versionName\"[[:space:]]*:[[:space:]]*\")[^\"]*(\")/\1$VERSION\2/" AppScope/app.json5
          sed -i -E "s/(\"versionCode\"[[:space:]]*:[[:space:]]*)[0-9]+/\1$((1000000 + PATCH))/" AppScope/app.json5
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "codename=$CODENAME"
            echo "patch=$PATCH"
          } >> "$GITHUB_OUTPUT"
          echo "Release: $VERSION $CODENAME PATCH$PATCH"

      - name: Cache toolchain zip
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/commandline-tools.zip
          key: hos-tools-6.1.1.280-v1

      - name: Download HarmonyOS command line tools (public, no auth)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          CANDIDATES=(
            "${{ vars.HOS_TOOLS_URL }}"
            "$HOS_TOOLS_PRIMARY"
            "$HOS_TOOLS_FALLBACK"
          )
          for url in "${CANDIDATES[@]}"; do
            [ -n "$url" ] || continue
            echo "Trying: $url"
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 \
                 -o ~/commandline-tools.zip "$url"; then
              echo "Downloaded from: $url"
              exit 0
            fi
            echo "Candidate failed, trying next…"
          done
          echo "::error::All commandline-tools sources failed."
          exit 1

      - name: Unpack and wire up toolchain
        run: |
          mkdir -p ~/hos-tools
          unzip -q ~/commandline-tools.zip -d ~/hos-tools
          # Layout-agnostic detection (zip root is command-line-tools/, but
          # do not depend on the name): find the hvigor engine and derive
          # the toolchain root from it.
          HVIGORW_JS=$(find ~/hos-tools -type f -name "hvigorw.js" | head -1)
          if [ -z "$HVIGORW_JS" ]; then
            echo "::error::hvigorw.js not found anywhere in the zip"
            exit 1
          fi
          TOOLS_HOME=$(cd "$(dirname "$HVIGORW_JS")/../.." && pwd)
          for required in "$TOOLS_HOME/sdk" "$TOOLS_HOME/bin/hvigorw" \
                          "$TOOLS_HOME/tool/node/bin/node"; do
            if [ ! -e "$required" ]; then
              echo "::error::unexpected toolchain layout: missing $required"
              exit 1
            fi
          done
          # Restore execute bits in case zip metadata did not carry them.
          chmod +x "$TOOLS_HOME/bin/"* \
                   "$TOOLS_HOME/hvigor/bin/hvigorw" \
                   "$TOOLS_HOME/tool/node/bin/node" 2>/dev/null || true
          echo "Tools root: $TOOLS_HOME"
          echo "TOOLS_HOME=$TOOLS_HOME" >> "$GITHUB_ENV"
          echo "$TOOLS_HOME/bin" >> "$GITHUB_PATH"
          echo "DEVECO_SDK_HOME=$TOOLS_HOME/sdk" >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          hvigorw --version || true
          node --version || true

      - name: Install oh_modules (root + entry)
        run: |
          ohpm install
          cd entry && ohpm install
          cd ..
          echo "=== ohpm / oh_modules diagnostics ==="
          ohpm -v || true
          ls -la entry/oh_modules/ || true
          if [ -e entry/oh_modules/mc4hos_core.so ]; then
            echo "SO-TYPES LINK: OK"
            readlink -f entry/oh_modules/mc4hos_core.so || true
          else
            echo "SO-TYPES LINK: MISSING"
          fi

      - name: Cache bundled Java runtimes
        uses: actions/cache@v4
        with:
          path: entry/src/main/resources/rawfile/jvm
          key: bundled-jres-${{ hashFiles('scripts/bundled-jres.lock.json') }}

      - name: Fetch bundled Java runtimes
        run: |
          python3 scripts/fetch_bundled_jres.py \
            --dest entry/src/main/resources/rawfile/jvm
          ls -la entry/src/main/resources/rawfile/jvm || true

      - name: Package JRE native libraries
        run: python3 scripts/bundle_jre_natives.py

      - name: Build bridge jar
        run: python3 scripts/build_bridge_jar.py

      - name: Build HAP (debug, unsigned)
        run: hvigorw --mode module -p module=entry@default -p product=default assembleHap

      - name: Collect HAPs
        run: |
          mkdir -p out
          find entry/build -name "*.hap" -exec cp {} out/ \;
          unzip -l out/*.hap | grep -q "rawfile/bridge/mc4hos-bridge.jar" \
            || { echo "::error::HAP is missing rawfile/bridge/mc4hos-bridge.jar"; exit 1; }
          for abi in arm64-v8a x86_64; do
            unzip -l out/*.hap | grep -q "libs/$abi/libjvm.so" \
              || { echo "::error::HAP is missing libs/$abi/libjvm.so"; exit 1; }
          done
          ls -la out

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc4hos-hap
          path: out/*.hap
          retention-days: 7
          if-no-files-found: error

      - name: Upload hvigor logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hvigor-logs
          path: |
            .hvigor/outputs/logs/**
            entry/.cxx/**/*.log
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: mc4hos-hap
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          CODENAME: ${{ needs.build.outputs.codename }}
          PATCH: ${{ needs.build.outputs.patch }}
        run: |
          set -euo pipefail
          SLUG="$(printf '%s' "$CODENAME" | tr '[:upper:]' '[:lower:]')"
          ASSET="mc4hos-${VERSION}-${SLUG}-patch${PATCH}.hap"
          mv dist/*.hap "dist/$ASSET"
          ( cd dist && sha256sum "$ASSET" > "$ASSET.sha256" )
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TARGET_ARGS=()
          else
            TARGET_ARGS=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" \
            --title "$VERSION $CODENAME PATCH$PATCH" \
            --notes "Unsigned HAP built from $GITHUB_SHA. Sign locally before installing." \
            "${TARGET_ARGS[@]}"
