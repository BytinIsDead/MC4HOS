#
# Cross-builds the separate OpenHarmony OpenJDK tree in openharmony-jdk/ for
# x86_64-linux-ohos. The runtime zips are build artifacts, never repository
# contents. Run manually with publish=true to populate the release that the
# launcher's x86_64 catalog entries point at.

name: OpenJDK x86_64 runtime

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish runtime zips and catalog to a GitHub release
        type: boolean
        default: false
      release_tag:
        description: Release tag to create/update when publishing
        type: string
        default: jdk-x86_64-v1
  push:
    tags:
      - "jdk-x86_64-v*"

permissions:
  contents: write

concurrency:
  group: jdk-x86_64-${{ github.ref }}
  cancel-in-progress: false

env:
  HOS_TOOLS_PRIMARY: https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/7ff999061d57e9a542fe7e02fc920961e67a163b/commandline-tools-linux-x64-6.1.1.280.zip
  HOS_TOOLS_FALLBACK: https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/main/commandline-tools-linux-x64-6.1.1.280.zip
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag || 'jdk-x86_64-v1' }}

jobs:
  build:
    name: JDK ${{ matrix.major }} / x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        major: [21, 25]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.major }}

      - name: Host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf build-essential zip unzip file libasound2-dev

      - name: Cache HarmonyOS toolchain zip
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/commandline-tools.zip
          key: hos-tools-6.1.1.280-v1

      - name: Download HarmonyOS command line tools (public, no auth)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          CANDIDATES=(
            "${{ vars.HOS_TOOLS_URL }}"
            "$HOS_TOOLS_PRIMARY"
            "$HOS_TOOLS_FALLBACK"
          )
          for url in "${CANDIDATES[@]}"; do
            [ -n "$url" ] || continue
            echo "Trying: $url"
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 \
                 -o ~/commandline-tools.zip "$url"; then
              echo "Downloaded from: $url"
              exit 0
            fi
            echo "Candidate failed, trying next…"
          done
          echo "::error::All commandline-tools sources failed."
          exit 1

      - name: Unpack toolchain and locate the native SDK
        run: |
          rm -rf ~/hos-tools
          mkdir -p ~/hos-tools
          unzip -q ~/commandline-tools.zip -d ~/hos-tools
          CMAKE=$(find ~/hos-tools -path "*/native/build/cmake/ohos.toolchain.cmake" -print -quit)
          if [ -z "$CMAKE" ]; then
            echo "::error::native/build/cmake/ohos.toolchain.cmake not found in toolchain zip"
            exit 1
          fi
          OHOS_NATIVE=$(cd "$(dirname "$CMAKE")/../.." && pwd)
          for required in "$OHOS_NATIVE/sysroot" "$OHOS_NATIVE/llvm/bin/clang"; do
            if [ ! -e "$required" ]; then
              echo "::error::unexpected SDK layout: missing $required"
              exit 1
            fi
          done
          echo "OHOS_NATIVE=$OHOS_NATIVE" >> "$GITHUB_ENV"
          echo "=== OpenJDK prerequisites ==="
          "$OHOS_NATIVE/llvm/bin/clang" --version | head -1
          ls "$OHOS_NATIVE/sysroot/usr/lib/x86_64-linux-ohos/libc.so"

      - name: Fetch pinned build inputs (patches + stubs)
        run: |
          python3 openharmony-jdk/scripts/fetch_inputs.py \
            --major "${{ matrix.major }}" \
            --dest "$RUNNER_TEMP/jdk-inputs-${{ matrix.major }}"

      - name: Cross-build and package
        env:
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}
        run: |
          openharmony-jdk/scripts/build_x86_64.sh \
            --major "${{ matrix.major }}" \
            --native "$OHOS_NATIVE" \
            --inputs "$RUNNER_TEMP/jdk-inputs-${{ matrix.major }}" \
            --work "$RUNNER_TEMP/jdk-work-${{ matrix.major }}" \
            --output "$GITHUB_WORKSPACE/dist"

      - name: Collect build logs on failure
        if: failure()
        run: |
          mkdir -p dist/logs
          cp "$RUNNER_TEMP"/jdk-work-${{ matrix.major }}/configure-*.log dist/logs/ 2>/dev/null || true
          cp "$RUNNER_TEMP"/jdk-work-${{ matrix.major }}/build-*.log dist/logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-jdk${{ matrix.major }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish runtime release
    needs: build
    if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/jdk-x86_64-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge catalogs and checksums
        run: |
          python3 - <<'PY'
          import json, pathlib
          entries = []
          for path in sorted(pathlib.Path("dist").glob("runtime-catalog-*.json")):
              entries.extend(json.loads(path.read_text(encoding="utf-8")))
          if len(entries) != 2:
              raise SystemExit(f"expected 2 catalog entries, got {len(entries)}")
          pathlib.Path("dist/runtime-catalog.json").write_text(
              json.dumps(entries, indent=2) + "\n", encoding="utf-8")
          PY
          cat dist/*.sha256 > dist/SHA256SUMS
          cat dist/runtime-catalog.json

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="OpenJDK x86_64 runtime packs for HarmonyOS/OpenHarmony.

          Built from the pinned upstream commits and OHOS patch series recorded in
          openharmony-jdk/build-inputs.lock.json. OpenJDK is GPLv2 with the
          Classpath Exception; each pack preserves the upstream license files and
          the exact source identities in MC4HOS-RUNTIME-NOTICE.txt."
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "OpenJDK x86_64 runtime ($RELEASE_TAG)" \
              --notes "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" \
            dist/*.zip dist/*.sha256 dist/runtime-catalog.json dist/SHA256SUMS \
            --clobber
